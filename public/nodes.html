<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>RayGate · 节点管理</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app" id="appRoot"><aside class="sidebar" aria-label="主导航"><a class="brand" href="/"><span class="brand-mark">RG</span><span><strong>RayGate</strong><small>节点设备控制台</small></span></a><nav>
<a class="nav-item" href="/vps.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>VPS 管理</a>
<a class="nav-item active" href="/nodes.html" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="m8 11 8-4M8 13l8 4"/></svg>节点管理</a>
<a class="nav-item" href="/"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M7 15h.01M11 9h6M11 15h6"/></svg>设备管理</a>
</nav><div class="sidebar-foot"><span><i></i>MySQL 持久化</span><small>SSH 真实节点</small></div></aside>
<main class="main nodes-main"><header class="page-head"><div><h1>节点管理</h1><p>接入已有 Xray 服务，查看节点能力并控制设备管理权限。</p></div><button class="button primary" id="connectService"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>接入 Xray 服务</button></header>
<section class="vps-toolbar node-toolbar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="nodeSearch" type="search" placeholder="搜索节点名称、服务或端口"></label><select id="serverFilter" aria-label="筛选 VPS"><option value="">全部 VPS</option></select><select id="nodeStatus" aria-label="筛选节点状态"><option value="all">全部状态</option><option value="healthy">运行正常</option><option value="readonly">只读</option><option value="unsupported">能力不完整</option><option value="missing">配置中未发现</option><option value="error">服务异常</option></select><button class="button subtle" id="refreshNodes">刷新</button></section>
<div class="vps-list-head"><h2>已接入服务 <span id="nodeCount">—</span></h2><p>管理权限只控制设备凭证，不启动或停止 Xray。</p></div><section id="serviceGroups" class="service-groups" aria-live="polite"></section><section class="vps-empty" id="nodeEmpty" hidden><h2>还没有匹配的节点</h2><p>接入 VPS 上已有的 Xray 服务后，节点会显示在这里。</p><button class="button primary" id="emptyConnect">接入 Xray 服务</button></section></main></div>

<dialog id="onboardDialog" class="onboard-dialog" aria-labelledby="onboardTitle"><form id="onboardForm"><header><div><h2 id="onboardTitle">接入已有 Xray 服务</h2><p>全过程只读检测，不修改配置或重启服务。</p></div><button type="button" class="icon-button" data-close="onboardDialog" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="dialog-body">
<ol class="onboard-steps"><li class="active">选择 VPS</li><li>发现服务</li><li>检测能力</li><li>完成接入</li></ol>
<label class="field">VPS <span>*</span><select id="onboardServer" required></select><small>需要先在 VPS 管理中确认 SSH 主机指纹。</small></label>
<div class="onboard-actions"><button type="button" class="button" id="discoverServices">发现 Xray 服务</button><button type="button" class="text-button" id="manualService">手动填写服务信息</button></div>
<p class="job-progress" id="onboardProgress" role="status"></p><div id="candidateList" class="candidate-list"></div>
<div class="form-grid manual-fields" id="manualFields" hidden><label class="field field-wide">systemd 服务名 <span>*</span><input id="serviceName" placeholder="xray.service"></label><label class="field field-wide">配置文件路径 <span>*</span><input id="configPath" placeholder="/usr/local/etc/xray/config.json"></label><label class="field">Xray 程序路径 <span>*</span><input id="binaryPath" value="/usr/local/bin/xray"></label><label class="field">API 地址 <span>*</span><input id="apiAddress" value="127.0.0.1:10085"></label></div>
<section id="preflightResult" class="preflight-result" hidden></section><p class="form-error" id="onboardError" role="alert"></p></div><footer><button type="button" class="button" data-close="onboardDialog">取消</button><button type="button" class="button" id="preflightService" disabled>检测服务</button><button type="submit" class="button primary" id="finishOnboard" disabled>确认接入</button></footer></form></dialog>

<dialog id="renameDialog" aria-labelledby="renameTitle"><form id="renameForm"><header><div><h2 id="renameTitle">修改节点名称</h2><p>只修改 RayGate 中的显示名称。</p></div></header><div class="dialog-body"><label class="field">节点名称 <span>*</span><input id="renameValue" maxlength="100" required></label><p class="form-error" id="renameError"></p></div><footer><button type="button" class="button" data-close="renameDialog">取消</button><button class="button primary">保存名称</button></footer></form></dialog>
<div class="drawer-shell" id="diagnosisShell" aria-hidden="true"><button class="drawer-backdrop" id="diagnosisBackdrop" aria-label="关闭诊断"></button><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="diagnosisTitle"><header><div><h2 id="diagnosisTitle">节点诊断</h2><p id="diagnosisSubtitle"></p></div><button class="icon-button" id="closeDiagnosis" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="drawer-body" id="diagnosisBody"></div></aside></div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div><script type="module" src="/nodes.js"></script></body></html>
