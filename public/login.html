<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · RayGate</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="loginTitle">
      <a class="login-brand" href="/login.html" aria-label="RayGate 登录"><span class="brand-mark">RG</span><span><strong>RayGate</strong><small>节点设备控制台</small></span></a>
      <header><h1 id="loginTitle">登录管理后台</h1><p>使用管理员账号继续访问 VPS、节点和设备数据。</p></header>
      <form id="loginForm">
        <label class="field">用户名<input id="username" name="username" autocomplete="username" maxlength="64" required autofocus></label>
        <label class="field">密码<span class="password-control"><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required><button type="button" id="togglePassword" aria-label="显示密码">显示</button></span><small id="capsNotice" hidden>Caps Lock 已开启</small></label>
        <label class="remember-control"><input id="remember" type="checkbox"><span>记住我 7 天</span></label>
        <p class="form-error login-error" id="loginError" role="alert"></p>
        <button class="button primary login-submit" id="loginButton">登录</button>
      </form>
      <p class="login-help">无法登录时，请在服务器本机执行管理员密码重置命令。</p>
    </section>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
